name: Add Sakin commission total

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Sakin commission to Order History
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/orders-history/page.tsx')
          s = p.read_text()

          old = '''<div className="rounded-lg bg-blue-100 px-4 py-2 text-sm font-bold text-blue-700">
          Sakin Total Orders: {confirmedCount(rows, "Sakin")}
        </div>'''

          new = '''<div className="rounded-lg bg-blue-100 px-4 py-2 text-sm font-bold text-blue-700">
          Sakin Total Orders: {confirmedCount(rows, "Sakin")}
        </div>
        <div className="rounded-lg bg-emerald-100 px-4 py-2 text-sm font-bold text-emerald-700">
          Sakin Commission: {money(commissionTotal(rows, "Sakin"))}
        </div>'''

          if 'Sakin Commission: {money(commissionTotal(rows, "Sakin"))}' not in s:
              if old not in s:
                  raise SystemExit('Sakin summary target not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-sakin-commission.yml
          git add app/orders-history/page.tsx .github/workflows/fix-sakin-commission.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Show Sakin commission total in Order History'
          git push
