name: Fix order confirmation JSX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix JSX wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/orders-history/page.tsx')
          s = p.read_text(encoding='utf-8')
          if '<>\n      <table className="w-full min-w-[1800px]">' not in s:
              s = s.replace('    return (\n      <table className="w-full min-w-[1800px]">', '    return (\n      <>\n      <table className="w-full min-w-[1800px]">', 1)
          s = s.replace('              <td\n                colSpan={17}', '              <td\n                colSpan={18}', 1)
          marker = '''      </div>\n    );\n  }\n\n  return ('''
          if marker not in s:
              raise SystemExit('summary closing marker not found')
          s = s.replace(marker, '''      </div>\n      </>\n    );\n  }\n\n  return (''', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/orders-history/page.tsx
          git diff --cached --quiet || git commit -m "Fix order confirmation JSX layout"
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/fix-order-confirmation-jsx.yml
          git add .github/workflows/fix-order-confirmation-jsx.yml
          git commit -m "Remove one-time JSX fix workflow"
          git push
