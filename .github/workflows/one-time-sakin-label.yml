name: One-time Sakin order summary patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Order History
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/orders-history/page.tsx')
          s = p.read_text()

          old_ui = '''<div className="rounded-lg bg-blue-100 px-4 py-2 text-sm font-bold text-blue-700">
          Sakin Total Orders: {confirmedCount(rows, "Sakin")}
        </div>'''
          new_ui = '''<div className="rounded-lg bg-blue-100 px-4 py-2 text-sm font-bold text-blue-700">
          Sakin Total Orders: {confirmedCount(rows, "Sakin")}
        </div>
        <div className="rounded-lg bg-emerald-100 px-4 py-2 text-sm font-bold text-emerald-700">
          Sakin Commission: {money(commissionTotal(rows, "Sakin"))}
        </div>'''

          if old_ui in s:
              s = s.replace(old_ui, new_ui, 1)
          elif 'Sakin Commission: {money(commissionTotal(rows, "Sakin"))}' not in s:
              raise SystemExit('Sakin summary target not found')

          p.write_text(s)
          PY

          rm -f .github/workflows/one-time-sakin-label.yml .github/workflows/update-sakin-summary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/orders-history/page.tsx .github/workflows/one-time-sakin-label.yml .github/workflows/update-sakin-summary.yml
          git commit -m 'Show Sakin total orders and commission'
          git push
