name: Update Sakin summary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update summary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/orders-history/page.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''      <div className="mt-4 flex flex-wrap items-center gap-3 rounded-xl border bg-gray-50 p-4">
        <div className="text-sm font-bold text-gray-700">Order Confirmed:</div>
        <div className="rounded-lg bg-blue-100 px-4 py-2 text-sm font-bold text-blue-700">
          Sakin Total Orders: {confirmedCount(rows, "Sakin")}
        </div>
      </div>'''

          new = '''      <div className="mt-4 flex flex-wrap items-center gap-3 rounded-xl border bg-gray-50 p-4">
        <div className="text-sm font-bold text-gray-700">Order Confirmed:</div>
        <div className="rounded-lg bg-blue-100 px-4 py-2 text-sm font-bold text-blue-700">
          Sakin Total Orders: {confirmedCount(rows, "Sakin")}
        </div>
        <div className="rounded-lg bg-emerald-100 px-4 py-2 text-sm font-bold text-emerald-700">
          Sakin Commission: {money(commissionTotal(rows, "Sakin"))}
        </div>
      </div>'''

          if old not in text:
              raise SystemExit('Target summary block not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change and remove workflow
        run: |
          git config user.name "motocharmbd"
          git config user.email "motocharmbdofficial@gmail.com"
          git add app/orders-history/page.tsx .github/workflows/update-sakin-summary.yml
          git commit -m "Show Sakin total orders and commission" || exit 0
          git rm .github/workflows/update-sakin-summary.yml
          git commit -m "Remove temporary Sakin update workflow"
          git push