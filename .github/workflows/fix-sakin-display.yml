name: Fix Sakin display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace commission display with order count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/orders-history/page.tsx')
          s = p.read_text()
          old = 'Sakin Commission: {money(commissionTotal(rows, "Sakin"))}'
          new = 'Sakin Total Orders: {confirmedCount(rows, "Sakin")}'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('Updated Sakin display')
          else:
              print('Sakin display already updated')
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/orders-history/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git rm .github/workflows/fix-sakin-display.yml
            git commit -m "Show Sakin total order count"
            git push
          fi
