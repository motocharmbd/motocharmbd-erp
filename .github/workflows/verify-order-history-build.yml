name: Verify order history build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sakin order count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/orders-history/page.tsx')
          s = p.read_text()
          old = 'Sakin Commission: {money(commissionTotal(rows, "Sakin"))}'
          new = 'Sakin Total Orders: {confirmedCount(rows, "Sakin")}'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit patch and remove one-time workflows
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/verify-order-history-build.yml .github/workflows/one-time-sakin-label.yml
          git add app/orders-history/page.tsx .github/workflows/verify-order-history-build.yml .github/workflows/one-time-sakin-label.yml
          git commit -m "Show Sakin total order count only"
          git push
