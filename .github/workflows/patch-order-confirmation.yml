name: Add order confirmation assignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Order History
        env:
          FILE: app/orders-history/page.tsx
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/orders-history/page.tsx")
          text = path.read_text(encoding="utf-8")

          if "confirmedByOrderId" in text:
              print("Order confirmation feature already exists")
              raise SystemExit(0)

          text = text.replace(
              "  tracking_code?: string;\n};",
              "  tracking_code?: string;\n};"
          )

          text = text.replace(
              "  const [saving, setSaving] = useState(false);\n  const hasSyncedRef = useRef(false);",
              "  const [saving, setSaving] = useState(false);\n  const [confirmedByOrderId, setConfirmedByOrderId] = useState<Record<string, string>>({});\n  const hasSyncedRef = useRef(false);"
          )

          text = text.replace(
              "  useEffect(() => {\n    loadAndAutoSyncOrders();\n  }, []);",
              "  useEffect(() => {\n    loadAndAutoSyncOrders();\n    try {\n      const saved = localStorage.getItem(\"mcb_order_confirmed_by\");\n      if (saved) setConfirmedByOrderId(JSON.parse(saved));\n    } catch (error) {\n      console.error(\"Failed to load order confirmation assignments\", error);\n    }\n  }, []);"
          )

          anchor = "  function statusClass(status: string) {"
          helper = '''  function setOrderConfirmedBy(orderId: number, person: string) {\n    setConfirmedByOrderId((current) => {\n      const next = { ...current };\n      if (person) next[String(orderId)] = person;\n      else delete next[String(orderId)];\n      try {\n        localStorage.setItem(\"mcb_order_confirmed_by\", JSON.stringify(next));\n      } catch (error) {\n        console.error(\"Failed to save order confirmation assignment\", error);\n      }\n      return next;\n    });\n  }\n\n  function confirmedCount(rows: Order[], person: string) {\n    return rows.filter((row) => confirmedByOrderId[String(row.id)] === person).length;\n  }\n\n'''
          if anchor not in text:
              raise SystemExit("statusClass anchor not found")
          text = text.replace(anchor, helper + anchor, 1)

          old_head = '''            <th className="p-3 text-left">Status</th>\n            <th className="p-3 text-left">Steadfast Courier</th>'''
          new_head = '''            <th className="p-3 text-left">Status</th>\n            <th className="p-3 text-left">Order Confirmed By</th>\n            <th className="p-3 text-left">Steadfast Courier</th>'''
          if old_head not in text:
              raise SystemExit("table header anchor not found")
          text = text.replace(old_head, new_head)

          old_cell = '''                  <td className="p-3">\n                    {item.tracking_code ? ('''
          new_cell = '''                  <td className="p-3">\n                    <select\n                      value={confirmedByOrderId[String(item.id)] || ""}\n                      onChange={(e) => setOrderConfirmedBy(item.id, e.target.value)}\n                      className="min-w-[135px] rounded-lg border bg-white px-2.5 py-1.5 text-xs font-semibold outline-none focus:border-blue-500"\n                      title="Select who confirmed this order"\n                    >\n                      <option value="">Select Name</option>\n                      <option value="Sakin">Sakin</option>\n                      <option value="Or">Or</option>\n                    </select>\n                  </td>\n                  <td className="p-3">\n                    {item.tracking_code ? ('''
          if old_cell not in text:
              raise SystemExit("tracking cell anchor not found")
          text = text.replace(old_cell, new_cell, 1)

          old_end = '''      </table>\n    );\n  }'''
          new_end = '''      </table>\n\n      <div className="mt-4 flex flex-wrap items-center gap-3 rounded-xl border bg-gray-50 p-4">\n        <div className="text-sm font-bold text-gray-700">Order Confirmed:</div>\n        <div className="rounded-lg bg-blue-100 px-4 py-2 text-sm font-bold text-blue-700">\n          Sakin: {confirmedCount(rows, "Sakin")} orders\n        </div>\n        <div className="rounded-lg bg-purple-100 px-4 py-2 text-sm font-bold text-purple-700">\n          Or: {confirmedCount(rows, "Or")} orders\n        </div>\n        <div className="rounded-lg bg-gray-200 px-4 py-2 text-sm font-semibold text-gray-700">\n          Unassigned: {rows.length - confirmedCount(rows, "Sakin") - confirmedCount(rows, "Or")} orders\n        </div>\n      </div>\n    );\n  }'''
          if old_end not in text:
              raise SystemExit("table end anchor not found")
          text = text.replace(old_end, new_end, 1)

          path.write_text(text, encoding="utf-8")
          print("Order confirmation assignment added")
          PY

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/orders-history/page.tsx
          git diff --cached --quiet || git commit -m "Add order confirmation assignment and counts"
          git push

      - name: Remove one-time patch workflow
        run: |
          rm -f .github/workflows/patch-order-confirmation.yml
          git add .github/workflows/patch-order-confirmation.yml
          git commit -m "Remove one-time order confirmation patch workflow"
          git push
