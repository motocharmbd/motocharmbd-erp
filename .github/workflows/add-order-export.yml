name: Add Order Export Feature

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-order-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch order history
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/orders-history/page.tsx")
          text = path.read_text(encoding="utf-8")
          marker = "// ORDER_EXPORT_FEATURE_V1"

          if marker in text:
              print("Order export already installed")
              raise SystemExit(0)

          anchor = '''function money(value: unknown) {
            return `৳${n(value).toLocaleString("en-BD")}`;
          }
          '''

          export_code = '''function money(value: unknown) {
            return `৳${n(value).toLocaleString("en-BD")}`;
          }

          // ORDER_EXPORT_FEATURE_V1
          function exportAllOrdersToSheet() {
            const headers = [
              "Invoice No", "Order ID", "Date", "Customer Name", "Phone",
              "Address", "Size", "Quantity", "Total Amount", "Advance Amount",
              "Product Cost", "Delivery Charge", "Boost Cost", "Total Cost", "Profit",
              "Status", "Payment Status", "Steadfast Tracking Code",
            ];

            const escapeCSV = (value: unknown) => {
              const valueText = value === null || value === undefined ? "" : String(value);
              return `"${valueText.replace(/"/g, '""')}"`;
            };

            const rows = orders.map((item) => {
              const productCost = n(item.product_cost);
              const delivery = n(item.delivery_charge);
              const boost = n(item.boost_cost);
              const totalAmount = n(item.total_amount);
              const totalCost = productCost + delivery + boost;
              const profit = totalAmount - totalCost;

              return [
                `MCB-${String(item.id).slice(0, 6).toUpperCase()}`,
                item.id,
                item.order_date || "",
                item.customer_name || "",
                item.phone || "",
                item.address || "",
                item.size || "",
                n(item.qty),
                totalAmount,
                n(item.advance_amount),
                productCost,
                delivery,
                boost,
                totalCost,
                profit,
                item.status || "Pending",
                item.payment_status || "Unpaid",
                item.tracking_code || "",
              ];
            });

            const csv = [headers, ...rows]
              .map((row) => row.map(escapeCSV).join(","))
              .join("\\r\\n");

            const blob = new Blob(["\\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `Moto_Charm_BD_All_Orders_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          }
          '''

          if anchor not in text:
              raise SystemExit("money() anchor not found")
          text = text.replace(anchor, export_code, 1)

          old_header = '''      <div className="mb-6">
        <h1 className="text-3xl font-bold">Order History</h1>
        <p className="mt-2 text-gray-500">View and manage orders grouped by date.</p>
      </div>
'''

          new_header = '''      <div className="mb-6 flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 className="text-3xl font-bold">Order History</h1>
          <p className="mt-2 text-gray-500">View and manage orders grouped by date.</p>
        </div>

        <button
          type="button"
          onClick={exportAllOrdersToSheet}
          disabled={orders.length === 0}
          className="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50"
          title="Export all orders to Excel / Google Sheets compatible CSV"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.8} stroke="currentColor" className="h-5 w-5">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14a2 2 0 0 0 2-2v-4M3 15v4a2 2 0 0 0 2 2" />
          </svg>
          Export All Orders
        </button>
      </div>
'''

          if old_header not in text:
              raise SystemExit("Order History header anchor not found")
          text = text.replace(old_header, new_header, 1)
          path.write_text(text, encoding="utf-8")
          print("Order export feature installed")
          PY

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/orders-history/page.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add export all orders to sheet"
          git push
