name: Update order commission

on:
  push:
    branches: [main]
    paths:
      - 'README.md'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Order History
        run: python3 scripts/update-order-commission.py
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/orders-history/page.tsx
          git commit -m 'Add dynamic order confirmation commission'
          git rm scripts/update-order-commission.py .github/workflows/update-order-commission.yml
          git commit -m 'Remove temporary commission migration files'
          git push
